[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-profile"
version = "0.1.0"
description = "A multi-pane terminal UI for viewing GitHub user profiles."
requires-python = ">=3.10"
dependencies = [
    "textual>=0.70.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
gh-profile = "gh_profile.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
